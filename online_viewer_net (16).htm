<meta charset="UTF-8"><div class="ev-book-wrap"><style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:wght@400;500;600;700&display=swap');

.ev-book-wrap{
    --ev-accent:#938a73;
    --ev-accent-2:#6d6758;
    --ev-accent-dark:#b9b09b;
    --ev-text:#c7c4b9;
    --ev-muted:#85847c;

    --ev-display:"Baskerville","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
    --ev-body:"Garamond","EB Garamond","Hoefler Text","Times New Roman",serif;

    box-sizing:border-box;

    width:100%;
    max-width:100%;
    min-width:0;

    min-height:100vh;
    min-height:100svh;
    min-height:100dvh;

    margin:0 auto;
    padding:0;

    overflow:hidden;
}

.ev-book-wrap *,
.ev-book-wrap *:before,
.ev-book-wrap *:after{
    box-sizing:border-box;
}

.ev-book{
    /* =====================================================
       ESCALA GENERAL
       ===================================================== */

    --ev-base-w:100rem;
    --ev-base-h:60rem;

    --ev-scale:clamp(
        .40,
        min(
            calc(100dvw / var(--ev-base-w)),
            calc(100dvh / var(--ev-base-h))
        ),
        2.4
    );

    --ev-type-scale:clamp(
        1,
        calc(1 / var(--ev-scale)),
        1.18
    );

    position:relative;

    width:100%;
    max-width:100%;
    min-width:0;

    height:100vh;
    height:100svh;
    height:100dvh;

    min-height:0;

    margin:0 auto;
    padding:0;

    overflow:hidden;

    background:#121411;
    color:var(--ev-text);
    font-family:var(--ev-body);

    border:1px solid rgba(167,160,137,.24);

    box-shadow:
        0 2rem 5.3125rem rgba(0,0,0,.84),
        inset 0 0 7.5rem rgba(0,0,0,.32);

    background-image:
        radial-gradient(circle at 14% 8%,rgba(163,156,133,.032),transparent 28%),
        radial-gradient(circle at 86% 88%,rgba(69,67,56,.04),transparent 34%),
        linear-gradient(90deg,rgba(0,0,0,.24),transparent 5%,transparent 95%,rgba(0,0,0,.24)),
        linear-gradient(180deg,rgba(255,255,255,.018),transparent 10%,transparent 88%,rgba(0,0,0,.24));
}

.ev-book-toggle{
    position:fixed!important;

    top:0!important;
    left:0!important;

    width:.0625rem!important;
    height:.0625rem!important;

    margin:0!important;
    padding:0!important;

    opacity:0!important;
    border:0!important;

    pointer-events:none!important;
}

.ev-pages{
    position:relative;

    width:100%;
    max-width:100%;
    min-width:0;

    height:100%;

    margin:0;
    padding:0;

    overflow:hidden;
}

.ev-page{
    position:absolute;

    top:0;
    left:50%;

    width:calc(100% / var(--ev-scale));
    max-width:none;

    height:var(--ev-base-h);

    min-width:0;
    min-height:var(--ev-base-h);

    margin:0;

    padding:4.25rem 8%;

    transform:translate3d(-50%,0,0) scale(var(--ev-scale));
    transform-origin:center top;

    overflow:hidden;

    color:var(--ev-text);

    background:
        radial-gradient(circle at 19% 12%,rgba(157,151,130,.045),transparent 28%),
        radial-gradient(circle at 82% 84%,rgba(66,65,54,.07),transparent 32%),
        radial-gradient(circle at 50% 50%,rgba(255,255,255,.008),transparent 66%),
        linear-gradient(180deg,#1d1e1a 0%,#151714 48%,#111310 100%);

    box-shadow:
        inset 0 0 6.25rem rgba(0,0,0,.24),
        inset 0 1px 0 rgba(255,255,255,.014);

    opacity:0;
    visibility:hidden;
    pointer-events:none;
    z-index:0;

    transition:
        opacity .42s ease,
        visibility 0s linear .42s;
}

.ev-page > *,
.ev-page-inner > *,
.ev-page-inner > div,
.ev-page-inner > section,
.ev-page-inner > article{
    min-width:0;
    max-width:100%;
}

.ev-page img{
    max-width:100%;
}

.ev-page iframe,
.ev-page video,
.ev-page canvas{
    max-width:100%;
}

.ev-page:before{
    content:"";

    position:absolute;
    inset:1.125rem;

    border:1px solid rgba(174,168,147,.12);

    box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.018),
        inset 0 0 2.625rem rgba(0,0,0,.18),
        0 0 0 1px rgba(0,0,0,.28);

    pointer-events:none;
    z-index:2;
}

.ev-page:after{
    content:"";

    position:absolute;
    inset:0;

    pointer-events:none;
    z-index:1;

    background:
        radial-gradient(
            ellipse at center,
            transparent 42%,
            rgba(0,0,0,.12) 78%,
            rgba(0,0,0,.42) 100%
        ),
        linear-gradient(
            90deg,
            rgba(0,0,0,.18),
            transparent 9%,
            transparent 91%,
            rgba(0,0,0,.20)
        ),
        linear-gradient(
            180deg,
            rgba(255,255,255,.014),
            transparent 13%,
            transparent 83%,
            rgba(0,0,0,.20)
        );
}

.ev-book-toggle:checked~.ev-pages .ev-page{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    z-index:0;
}

.ev-book-toggle[id="ev-p01"]:checked~.ev-pages .ev-p01,
.ev-book-toggle[id="ev-p02"]:checked~.ev-pages .ev-p02,
.ev-book-toggle[id="ev-p03"]:checked~.ev-pages .ev-p03,
.ev-book-toggle[id="ev-p04"]:checked~.ev-pages .ev-p04,
.ev-book-toggle[id="ev-p05"]:checked~.ev-pages .ev-p05,
.ev-book-toggle[id="ev-p06"]:checked~.ev-pages .ev-p06,
.ev-book-toggle[id="ev-p07"]:checked~.ev-pages .ev-p07,
.ev-book-toggle[id="ev-p08"]:checked~.ev-pages .ev-p08,
.ev-book-toggle[id="ev-p09"]:checked~.ev-pages .ev-p09,
.ev-book-toggle[id="ev-p10"]:checked~.ev-pages .ev-p10,
.ev-book-toggle[id="ev-p11"]:checked~.ev-pages .ev-p11,
.ev-book-toggle[id="ev-p12"]:checked~.ev-pages .ev-p12,
.ev-book-toggle[id="ev-p13"]:checked~.ev-pages .ev-p13,
.ev-book-toggle[id="ev-p14"]:checked~.ev-pages .ev-p14,
.ev-book-toggle[id="ev-p15"]:checked~.ev-pages .ev-p15,
.ev-book-toggle[id="ev-p16"]:checked~.ev-pages .ev-p16,
.ev-book-toggle[id="ev-p17"]:checked~.ev-pages .ev-p17,
.ev-book-toggle[id="ev-p18"]:checked~.ev-pages .ev-p18,
.ev-book-toggle[id="ev-p19"]:checked~.ev-pages .ev-p19,
.ev-book-toggle[id="ev-p20"]:checked~.ev-pages .ev-p20,
.ev-book-toggle[id="ev-p21"]:checked~.ev-pages .ev-p21,
.ev-book-toggle[id="ev-p22"]:checked~.ev-pages .ev-p22,
.ev-book-toggle[id="ev-p23"]:checked~.ev-pages .ev-p23,
.ev-book-toggle[id="ev-p24"]:checked~.ev-pages .ev-p24,
.ev-book-toggle[id="ev-p25"]:checked~.ev-pages .ev-p25,
.ev-book-toggle[id="ev-p26"]:checked~.ev-pages .ev-p26,
.ev-book-toggle[id="ev-p27"]:checked~.ev-pages .ev-p27,
.ev-book-toggle[id="ev-p28"]:checked~.ev-pages .ev-p28,
.ev-book-toggle[id="ev-p29"]:checked~.ev-pages .ev-p29,
.ev-book-toggle[id="ev-p30"]:checked~.ev-pages .ev-p30,
.ev-book-toggle[id="ev-p31"]:checked~.ev-pages .ev-p31,
.ev-book-toggle[id="ev-p32"]:checked~.ev-pages .ev-p32,
.ev-book-toggle[id="ev-p33"]:checked~.ev-pages .ev-p33,
.ev-book-toggle[id="ev-p34"]:checked~.ev-pages .ev-p34,
.ev-book-toggle[id="ev-p35"]:checked~.ev-pages .ev-p35,
.ev-book-toggle[id="ev-p36"]:checked~.ev-pages .ev-p36,
.ev-book-toggle[id="ev-p37"]:checked~.ev-pages .ev-p37,
.ev-book-toggle[id="ev-p38"]:checked~.ev-pages .ev-p38,
.ev-book-toggle[id="ev-p39"]:checked~.ev-pages .ev-p39,
.ev-book-toggle[id="ev-p40"]:checked~.ev-pages .ev-p40,
.ev-book-toggle[id="ev-p41"]:checked~.ev-pages .ev-p41{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    z-index:5;

    transition:
        opacity .42s ease,
        visibility 0s linear 0s;
}

/* =========================================================
   TEXTO GLOBAL
   ========================================================= */

.ev-page-inner,
.ev-page-inner p,
.ev-page-inner li,
.ev-page-inner span,
.ev-page-inner div{
    text-align:justify;
}

.ev-page-title,
.ev-section-title,
.ev-subtitle,
.ev-region-kicker,
.ev-kicker,
.ev-settlement-index,
.ev-faction-number,
.ev-entry-index{
    text-align:left;
}

.ev-page-inner .ev-caption,
.ev-footer,
.ev-footer-center{
    text-align:center!important;
}

/* =========================================================
   HISTORIA
   ========================================================= */

.ev-page.ev-p03 .ev-page-inner{
    text-align:justify!important;
}

.ev-page.ev-p03 .ev-kicker{
    text-align:left!important;
}

.ev-page.ev-p03 .ev-page-title{
    text-align:center!important;
}

.ev-page.ev-p03 .ev-history-copy{
    text-align:justify!important;
}

.ev-page.ev-p03 .ev-history-copy p{
    text-align:justify!important;
}

/* =========================================================
   CAPÍTULOS
   ========================================================= */

.ev-chapter .ev-kicker,
.ev-chapter .ev-chapter-number,
.ev-chapter .ev-chapter-title,
.ev-chapter .ev-ornament,
.ev-chapter .ev-section-text{
    text-align:center!important;
}

.ev-chapter .ev-page-inner{
    text-align:center!important;
}

.ev-chapter .ev-page-inner *{
    text-align:center!important;
}

/* =========================================================
   TIPOGRAFÍA
   ========================================================= */

.ev-page-inner{
    position:relative;
    z-index:3;

    width:100%;
    max-width:100%;
    min-width:0;
}

.ev-kicker,
.ev-region-kicker,
.ev-settlement-index,
.ev-entry-index{
    display:block;

    font-size:calc(.625rem * var(--ev-type-scale));
    line-height:1.4;
    font-family:var(--ev-display);
    font-weight:600;

    letter-spacing:.20em;
    text-transform:uppercase;

    color:#8f8875;

    text-shadow:0 .0625rem .5rem rgba(0,0,0,.55);
}

.ev-faction-number{
    display:block;

    font-size:calc(.75rem * var(--ev-type-scale));
    line-height:1.5;
    font-family:var(--ev-display);
    font-weight:600;

    letter-spacing:.20em;
    text-transform:uppercase;

    color:#8f8875;

    text-shadow:0 .0625rem .5rem rgba(0,0,0,.55);
}

.ev-kicker{
    margin:0 0 .625rem;
    letter-spacing:.22em;
}

.ev-page-title{
    margin:0 0 1.125rem;

    font-size:calc(clamp(1.75rem,4vw,3.125rem) * var(--ev-type-scale));
    line-height:1.05;
    font-family:var(--ev-display);
    font-weight:400;

    letter-spacing:.015em;

    color:#b5ad99;

    text-shadow:
        0 .125rem .75rem rgba(0,0,0,.58),
        0 0 .0625rem rgba(215,207,184,.08);
}

.ev-page-subtitle{
    display:block;

    width:100%;
    max-width:48.75rem;

    margin:0 auto 1.75rem;

    font-size:calc(.9375rem * var(--ev-type-scale));
    line-height:1.86;

    color:#9c9688;

    text-align:center!important;

    text-shadow:0 .125rem .5625rem rgba(0,0,0,.92);
}

.ev-prose,
.ev-region-copy,
.ev-region-description,
.ev-region-settlement,
.ev-government-copy,
.ev-economic-text,
.ev-culture-text,
.ev-entry-text,
.ev-military-text,
.ev-intro-copy,
.ev-history-copy{
    font-size:calc(1.0625rem * var(--ev-type-scale));
    line-height:1.86;
    color:#c0bdb3;
}

.ev-prose p,
.ev-region-copy p,
.ev-region-description p,
.ev-region-settlement p,
.ev-government-copy p,
.ev-economic-text p,
.ev-culture-text p,
.ev-entry-text p,
.ev-military-text p,
.ev-intro-copy p,
.ev-history-copy p{
    margin:0 0 1em;
    line-height:inherit;
    color:#c0bdb3;
    text-shadow:0 .0625rem .4375rem rgba(0,0,0,.24);
}

.ev-prose p:last-child,
.ev-region-copy p:last-child,
.ev-region-description p:last-child,
.ev-region-settlement p:last-child,
.ev-government-copy p:last-child,
.ev-economic-text p:last-child,
.ev-culture-text p:last-child,
.ev-entry-text p:last-child,
.ev-military-text p:last-child,
.ev-intro-copy p:last-child,
.ev-history-copy p:last-child{
    margin-bottom:0;
}

.ev-intro-lead{
    margin:0 0 1.375rem;

    font-size:calc(clamp(1.625rem,3vw,2.5rem) * var(--ev-type-scale));
    line-height:1.14;
    font-family:var(--ev-display);
    font-weight:400;

    color:#b5ad99;

    text-shadow:
        0 .125rem .75rem rgba(0,0,0,.58),
        0 0 .0625rem rgba(215,207,184,.08);
}

.ev-subtitle{
    margin:0 0 .9375rem;

    font-size:calc(1.375rem * var(--ev-type-scale));
    line-height:1.25;
    font-family:var(--ev-display);
    font-weight:400;

    color:#b5ad99;
}

.ev-section-title{
    margin:0 0 .75rem;

    font-size:calc(1rem * var(--ev-type-scale));
    line-height:1.3;
    font-family:var(--ev-display);
    font-weight:600;

    letter-spacing:.06em;

    color:#b5ad99;
}

.ev-rule-line{
    height:.0625rem;

    margin:1.75rem 0;

    background:
        linear-gradient(
            90deg,
            transparent 0%,
            rgba(121,115,97,.10) 15%,
            rgba(150,142,118,.34) 50%,
            rgba(121,115,97,.10) 85%,
            transparent 100%
        );

    box-shadow:0 .0625rem 0 rgba(0,0,0,.34);
}

.ev-ornament{
    display:flex;
    align-items:center;

    gap:1rem;

    width:min(24.375rem,72%);

    margin:1.125rem auto;
}

.ev-ornament:before,
.ev-ornament:after{
    content:"";
    flex:1;
    height:.0625rem;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(125,118,98,.40),
            transparent
        );
}

.ev-ornament span{
    color:#817966;
    font-size:calc(1rem * var(--ev-type-scale));
    text-align:center!important;

    text-shadow:0 .0625rem .5rem rgba(0,0,0,.8);
}

/* =========================================================
   LAYOUTS
   ========================================================= */

.ev-columns{
    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        minmax(0,1fr);

    gap:3rem;
    align-items:start;
}

.ev-columns > *,
.ev-text-image > *,
.ev-region-page > *,
.ev-government-layout > *,
.ev-economy-intro > *,
.ev-culture-layout > *,
.ev-region-main > *,
.ev-faction-page > *,
.ev-settlement-page > *,
.ev-tradition-page > *,
.ev-military-page > *{
    min-width:0;
}

.ev-text-image{
    display:grid;

    grid-template-columns:
        minmax(0,1.05fr)
        minmax(0,.95fr);

    gap:3.125rem;
    align-items:start;
}

.ev.text-image.reverse{
    grid-template-columns:
        minmax(0,.95fr)
        minmax(0,1.05fr);
}

.ev-region-page{
    display:grid;

    grid-template-columns:
        minmax(0,1.05fr)
        minmax(0,.95fr);

    gap:3.125rem;
    align-items:start;
}

.ev-region-page.reverse{
    grid-template-columns:
        minmax(0,.95fr)
        minmax(0,1.05fr);
}

.ev-government-layout{
    display:grid;

    grid-template-columns:
        minmax(0,1.05fr)
        minmax(0,.95fr);

    gap:3.125rem;
    align-items:start;
}

.ev-economy-intro{
    display:grid;

    grid-template-columns:
        minmax(0,1.05fr)
        minmax(0,.95fr);

    gap:3.125rem;
    align-items:start;
}

.ev-culture-layout{
    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        minmax(0,.82fr);

    gap:3.125rem;
    align-items:start;
}

.ev-culture-layout.reverse{
    grid-template-columns:
        minmax(0,.82fr)
        minmax(0,1fr);
}

/* =========================================================
   PRÓLOGO
   ========================================================= */

.ev-intro-layout{
    display:grid;

    grid-template-columns:
        minmax(0,1.02fr)
        minmax(0,.98fr);

    gap:3.375rem;

    align-items:start;
}

.ev-intro-copy{
    padding-right:.5rem;
    min-width:0;
}

.ev-intro-heraldry{
    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;
    align-self:stretch;

    width:100%;
    min-width:0;
    min-height:35rem;
}

.ev-heraldry-frame{
    position:relative;

    display:flex;

    align-items:center;
    justify-content:center;

    width:min(100%,29.375rem);
    height:35rem;

    margin:auto;

    overflow:hidden;

    background:transparent;

    border:0;

    box-shadow:none;
}

.ev-heraldry-frame:before,
.ev-heraldry-frame:after{
    display:none;
}

.ev-heraldry-frame img{
    display:block;

    width:100%;
    height:100%;

    max-width:100%;
    max-height:100%;

    object-fit:contain;
    object-position:center;

    filter:
        grayscale(.86)
        sepia(.11)
        saturate(.20)
        contrast(1.07)
        brightness(.52);

    transform:none!important;

    transition:
        filter .45s ease;
}

.ev-heraldry-frame:hover img{
    transform:none!important;

    filter:
        grayscale(.74)
        sepia(.11)
        saturate(.25)
        contrast(1.07)
        brightness(.60);
}

.ev-heraldry-caption{
    margin-top:.75rem;

    font-size:calc(.6875rem * var(--ev-type-scale));
    line-height:1.5;
    font-family:var(--ev-display);
    font-style:italic;

    color:#79776f;

    text-align:center!important;

    text-shadow:
        0 .0625rem .3125rem rgba(0,0,0,.55);
}

/* =========================================================
   REGIONES
   ========================================================= */

.ev-region-main{
    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        minmax(21.25rem,.78fr);

    gap:2.75rem;

    align-items:start;
}

.ev-region-description{
    min-height:20.3125rem;
}

.ev-region-settlements{
    margin-top:1.625rem;
}

.ev-region-settlements-title{
    margin:0 0 .75rem;

    font-size:calc(.8125rem * var(--ev-type-scale));
    line-height:1.3;
    font-family:var(--ev-display);
    font-weight:600;

    letter-spacing:.14em;
    text-transform:uppercase;

    color:#918a75;

    text-align:left;
}

.ev-region-settlement{
    margin:0 0 1.125rem;
    padding:0 0 1.125rem;

    border-bottom:1px dashed rgba(143,137,118,.17);

    min-width:0;
}

.ev-region-settlement:last-child{
    margin-bottom:0;
    padding-bottom:0;
    border-bottom:0;
}

.ev-region-settlement h3{
    margin:0 0 .5rem;

    font-size:calc(1.375rem * var(--ev-type-scale));
    line-height:1.2;
    font-family:var(--ev-display);
    font-weight:400;

    color:#b5ad99;

    text-align:left;
}

.ev-region-side{
    min-width:0;
    max-width:100%;

    display:flex;
    flex-direction:column;
    align-items:flex-start;
}

.ev-page.ev-p06 .ev-region-side{
    align-items:flex-end;
}

.ev-page.ev-p07 .ev-region-side{
    align-items:flex-start;
}

.ev-region-side .ev-image-frame{
    width:min(100%,40rem);
    height:30rem;

    margin:0;
}

.ev-region-side .ev-image-frame img{
    width:100%;
    height:100%;

    max-height:none;

    aspect-ratio:auto;
    object-fit:cover;
}

.ev-region-meta{
    width:min(100%,40rem);

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    margin-top:1.375rem;
}

.ev-page.ev-p06 .ev-region-meta{
    margin-left:auto;
    margin-right:0;
}

.ev-page.ev-p07 .ev-region-meta{
    margin-left:0;
    margin-right:auto;
}

.ev-region-meta-item{
    min-width:0;

    padding:.6875rem .9375rem .8125rem;

    border-top:1px solid rgba(139,132,111,.13);
}

.ev-region-meta-item:nth-child(-n+2){
    border-top-color:rgba(151,143,119,.18);
}

.ev-region-meta-item strong{
    display:block;

    margin-bottom:.375rem;

    font-size:calc(.625rem * var(--ev-type-scale));
    line-height:1.45;
    font-family:var(--ev-display);
    font-weight:600;

    letter-spacing:.15em;

    text-transform:uppercase;

    color:#89826f;

    text-align:left!important;
}

.ev-region-meta-item span{
    display:block;

    font-size:calc(.9375rem * var(--ev-type-scale));
    line-height:1.6;

    color:#aaa69b;

    text-align:left!important;

    overflow-wrap:anywhere;
}

/* =========================================================
   HISTORIA

/* =========================================================
   SISTEMA DE IMÁGENES
   ========================================================= */

.ev-image-frame{
    position:relative;

    display:block;

    width:100%;
    max-width:100%;

    margin:0;

    padding:0;

    overflow:hidden;

    background:#0e100d;

    box-shadow:
        0 1.125rem 2.125rem rgba(0,0,0,.52),
        0 .125rem 0 rgba(202,194,169,.025);
}

.ev-image-frame:before{
    content:"";

    position:absolute;
    inset:0;

    z-index:2;

    border:1px solid rgba(190,181,157,.13);

    box-shadow:
        inset 0 0 1.75rem rgba(0,0,0,.18);

    pointer-events:none;
}

.ev-image-frame:after{
    content:"";

    position:absolute;
    inset:0;

    z-index:1;

    pointer-events:none;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.05),
            transparent 34%,
            rgba(0,0,0,.16)
        ),
        radial-gradient(
            ellipse at center,
            transparent 48%,
            rgba(0,0,0,.20) 100%
        );
}

.ev-image-frame img{
    display:block;

    width:100%;
    max-width:100%;
    height:100%;

    max-height:none;

    object-fit:cover;
    object-position:center;

    aspect-ratio:auto;

    filter:
        grayscale(.82)
        sepia(.13)
        saturate(.24)
        contrast(1.06)
        brightness(.53);

    transition:
        filter .45s ease,
        transform .45s ease;
}

.ev-image-frame img[src*="picsum.photos"]{
    filter:
        grayscale(.86)
        sepia(.11)
        saturate(.20)
        contrast(1.07)
        brightness(.52);
}

.ev-image-frame:hover img{
    transform:scale(1.014);

    filter:
        grayscale(.70)
        sepia(.13)
        saturate(.30)
        contrast(1.06)
        brightness(.61);
}

/* =========================================================
   IMÁGENES COMUNES
   ========================================================= */

.ev-image-frame.standard{
    width:min(100%,40rem);
    height:30rem;

    aspect-ratio:4/3;

    margin:0;
}

.ev-image-frame.standard img{

   ========================================================= */

.ev-data-value,

.ev-identity-item{

/* =========================================================
   NAVEGACIÓN
   ========================================================= */

.ev-footer{
    position:absolute;

    left:8%;
    right:8%;
    bottom:2.125rem;

    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:1.125rem;

    min-width:0;

    padding-top:1rem;

    border-top:1px dashed rgba(135,128,108,.15);

    font-size:calc(.5625rem * var(--ev-type-scale));
    line-height:1.4;
    font-family:var(--ev-display);
    font-weight:600;

    letter-spacing:.16em;
    text-transform:uppercase;

    color:#858071;

    text-shadow:0 .0625rem .3125rem rgba(0,0,0,.55);

    text-align:center!important;
}

.ev-footer>span:first-child,
.ev-footer>span:last-child{
    position:relative;
    z-index:1;

    flex:0 0 5rem;

    min-width:0;
}

.ev-footer>span:first-child{
    text-align:left!important;
}

.ev-footer>span:last-child{
    text-align:right!important;
}

.ev-footer-center{
    position:absolute;

    left:50%;

    width:max-content;
    max-width:60%;

    transform:translateX(-50%);

    color:#7d796e;

    cursor:pointer;

    padding:.3125rem .5rem;

    transition:
        color .35s ease,
        letter-spacing .35s ease;
}

.ev-footer-center:hover{
    color:#c0b7a1;
    letter-spacing:.18em;
}

.ev-hit{
    position:absolute;

    top:0;
    bottom:0;

    width:50%;

    z-index:25;

    cursor:pointer;

    background:transparent;
}

.ev-hit-prev{
    left:0;
}

.ev-hit-next{
    right:0;
}

.ev-hit:after{
    content:"";

    position:absolute;

    top:50%;

    width:.625rem;
    height:.625rem;

    border-top:1px solid #8f8875;
    border-right:1px solid #8f8875;

    opacity:.12;

    filter:drop-shadow(0 .0625rem .25rem rgba(0,0,0,.8));

    transition:
        opacity .35s ease,
        transform .35s ease;
}

.ev-hit:hover:after{
    opacity:.44;
}

.ev-hit-prev:after{
    left:1.375rem;
    transform:translateY(-50%) rotate(-135deg);
}

.ev-hit-next:after{
    right:1.375rem;
    transform:translateY(-50%) rotate(45deg);
}

.ev-hit-prev:hover:after{
    transform:translate(-.125rem,-50%) rotate(-135deg);
}

.ev-hit-next:hover:after{
    transform:translate(.125rem,-50%) rotate(45deg);
}
